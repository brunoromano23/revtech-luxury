<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page {
    size: A4;
    margin: 18mm 16mm 20mm 16mm;
  }

  :root {
    --ink:      #14161a;
    --ink-soft: #4a5158;
    --rule:     #dfe3e8;
    --rule-soft:#eef1f4;
    --accent:   #1c3f5f;
    --accent-bg:#f3f6f9;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 9.6pt;
    line-height: 1.52;
    color: var(--ink);
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- headings ------------------------------------------------------- */

  h1 {
    font-size: 21pt;
    line-height: 1.18;
    letter-spacing: -0.015em;
    margin: 0 0 2mm;
    color: var(--accent);
    font-weight: 700;
  }
  /* the "## subtitle" immediately under the H1 acts as the cover deck */
  h1 + h2 {
    font-size: 12.5pt;
    font-weight: 400;
    color: var(--ink-soft);
    border: 0;
    margin: 0 0 7mm;
    padding: 0;
    letter-spacing: 0;
  }

  h2 {
    font-size: 13pt;
    margin: 9mm 0 3mm;
    padding-bottom: 1.6mm;
    border-bottom: 1.6px solid var(--accent);
    color: var(--accent);
    letter-spacing: -0.01em;
    break-after: avoid;
  }

  h3 {
    font-size: 10.6pt;
    margin: 6mm 0 2mm;
    color: var(--ink);
    break-after: avoid;
  }

  h4 {
    font-size: 9.8pt;
    margin: 4.5mm 0 1.5mm;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    break-after: avoid;
  }

  p { margin: 0 0 2.6mm; }

  /* ---- rules ---------------------------------------------------------- */

  hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 7mm 0;
  }

  /* ---- tables --------------------------------------------------------- */

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 3mm 0 5mm;
    font-size: 8.7pt;
    break-inside: auto;
  }
  thead { display: table-header-group; }
  tr { break-inside: avoid; }

  th {
    background: var(--accent-bg);
    text-align: left;
    font-weight: 600;
    color: var(--accent);
    padding: 2mm 2.4mm;
    border-bottom: 1.4px solid var(--rule);
    vertical-align: bottom;
  }
  td {
    padding: 2mm 2.4mm;
    border-bottom: 1px solid var(--rule-soft);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: 1px solid var(--rule); }

  /* first column of an ID table stays on one line and reads as a key */
  td:first-child { white-space: nowrap; }
  td:first-child code { white-space: nowrap; }
  table table td:first-child { white-space: normal; }

  /* the metadata block at the top of the doc is a 2-col table with no header */
  h1 ~ table:first-of-type { font-size: 9pt; }

  /* ---- inline ---------------------------------------------------------- */

  code {
    font-family: var(--mono);
    font-size: 0.88em;
    background: #f1f3f6;
    padding: 0.4mm 1.1mm;
    border-radius: 2px;
    color: #1f2a37;
  }

  pre {
    background: #f7f8fa;
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 3mm;
    font-size: 8.2pt;
    line-height: 1.45;
    overflow: hidden;
    white-space: pre-wrap;
    break-inside: avoid;
  }
  pre code { background: none; padding: 0; }

  strong { font-weight: 650; color: var(--ink); }

  a { color: var(--accent); text-decoration: none; }

  blockquote {
    margin: 3mm 0;
    padding: 2.5mm 4mm;
    border-left: 2.5px solid var(--accent);
    background: var(--accent-bg);
    color: var(--ink);
    break-inside: avoid;
  }
  blockquote p:last-child { margin-bottom: 0; }

  ul, ol { margin: 0 0 3mm; padding-left: 5.5mm; }
  li { margin-bottom: 1.2mm; }

  /* ---- pagination ------------------------------------------------------ */

  h2, h3 { break-after: avoid; }
  h2 + table, h3 + table, h2 + p, h3 + p { break-before: avoid; }
</style>
</head>
<body>

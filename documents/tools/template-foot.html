<script>
  // marked emits ```mermaid fences as <pre><code class="language-mermaid">.
  // Swap them for the <div class="mermaid"> mermaid expects, using textContent
  // so the HTML-escaped source is decoded back to the original diagram text.
  document.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    code.parentNode.replaceWith(div);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
      fontFamily: '-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif',
      fontSize: '13px',
      primaryColor: '#f3f6f9',
      primaryTextColor: '#14161a',
      primaryBorderColor: '#1c3f5f',
      lineColor: '#4a5158'
    },
    er: { fontSize: 12, entityPadding: 12, useMaxWidth: true }
  });

  // build-pdf.sh polls for this flag before printing.
  mermaid.run().then(function () {
    window.__renderComplete = true;
  }).catch(function (e) {
    console.error('mermaid failed:', e);
    window.__renderComplete = true;
  });
</script>
</body></html>

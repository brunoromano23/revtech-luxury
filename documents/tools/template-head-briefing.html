<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  House style for LP-REVTECH-CPQ-SD-001, rendered by WeasyPrint.

  Rendered by WeasyPrint rather than headless Chrome because Chrome applies one page size to the
  whole document: a landscape page for the ERD is impossible there, and the alternative - rotating
  the figure on a portrait page - leaves the caption running vertically while the running header
  stays horizontal, which reads as broken. WeasyPrint supports named pages with their own size,
  resolves target-counter for the contents, and needs no JavaScript at all.
-->
<style>
  :root {
    --ink:     #14161a;
    --muted:   #7a7d84;
    --brass:   #8a6d3b;
    --cream:   #faf7ef;
    --rule:    #dcdcd4;
    --code-bg: #f4f4f0;

    --serif: Charter, "Source Serif Pro", Georgia, "Times New Roman", serif;
    --sans:  Inter, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono:  ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  /* ---- page furniture ------------------------------------------------- */

  @page {
    size: A4;
    margin: 18mm 16mm 20mm 16mm;

    @top-left {
      content: string(sectiontitle);
      font-family: var(--sans);
      font-size: 7pt;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    @top-right {
      content: "Custom CPQ on Salesforce · Business Briefing";
      font-family: var(--sans);
      font-size: 7pt;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    @bottom-left {
      content: "LP-REVTECH-CPQ-BB-001 · v1.0";
      font-family: var(--mono);
      font-size: 7pt;
      color: var(--muted);
    }
    @bottom-right {
      content: counter(page) " / " counter(pages);
      font-family: var(--mono);
      font-size: 7pt;
      color: var(--muted);
    }
  }

  /* The cover carries no running furniture. */
  @page :first {
    @top-left { content: none; }
    @top-right { content: none; }
    @bottom-left { content: none; }
    @bottom-right { content: none; }
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--serif);
    font-size: 9.6pt;
    line-height: 1.52;
    color: var(--ink);
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  p { margin: 0 0 3mm; orphans: 2; widows: 2; }

  /* ---- cover ----------------------------------------------------------- */

  .cover { break-after: page; }

  .cover-rule      { border-top: 2px solid var(--ink); margin: 0; }
  .cover-rule + .cover-rule-brass { border-top: 1px solid var(--brass); margin: 3mm 0 14mm; }

  .cover h1 {
    font-family: var(--sans);
    font-size: 21pt;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 0 0 1mm;
    border: 0;
    padding: 0;
  }
  .cover .subtitle {
    font-family: var(--sans);
    font-size: 12pt;
    color: var(--muted);
    margin: 0 0 16mm;
  }
  .eyebrow {
    font-family: var(--sans);
    font-size: 7pt;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--muted);
    margin: 0 0 12mm;
  }
  .cover h2 {
    font-family: var(--sans);
    font-size: 7pt;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--brass);
    border: 0;
    border-bottom: 1px solid var(--rule);
    padding: 0 0 2mm;
    margin: 0 0 4mm;
    counter-increment: none;
  }
  .cover table { margin: 0 0 12mm; }
  .cover table td:first-child {
    font-family: var(--sans);
    font-size: 7pt;
    text-transform: uppercase;
    letter-spacing: 0.10em;
    color: var(--muted);
    width: 34%;
    vertical-align: top;
  }
  .cover table strong { font-weight: inherit; }
  .cover-foot {
    margin-top: 18mm;
    padding-top: 3mm;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 7pt;
    color: var(--muted);
  }

  /* ---- headings -------------------------------------------------------- */

  h2 {
    font-family: var(--sans);
    font-size: 16pt;
    font-weight: 700;
    color: var(--ink);
    margin: 10mm 0 5mm;
    padding-bottom: 2.5mm;
    border-bottom: 1px solid var(--ink);
    string-set: sectiontitle content();
    break-after: avoid;
  }
  h2 .num { color: var(--brass); margin-right: 3mm; }
  /* Present in the text so string-set produces "4 — Data model" rather than "4Data model",
     invisible on the page so the brass number keeps its CSS spacing. */
  .numsep { font-size: 0; }

  h3 {
    font-family: var(--sans);
    font-size: 10.5pt;
    font-weight: 700;
    color: var(--ink);
    margin: 7mm 0 2.5mm;
    break-after: avoid;
  }
  h3 .num { color: var(--brass); margin-right: 2mm; font-weight: 600; }

  h4 {
    font-family: var(--sans);
    font-size: 9pt;
    font-weight: 700;
    margin: 5mm 0 2mm;
    break-after: avoid;
  }

  /* ---- design decision callouts ---------------------------------------- */

  blockquote {
    margin: 5mm 0;
    padding: 4mm 5mm;
    background: var(--cream);
    border-left: 3px solid var(--brass);
    break-inside: avoid;
  }
  blockquote p { margin: 0 0 2.5mm; }
  blockquote p:last-child { margin-bottom: 0; }
  blockquote .callout-head {
    font-family: var(--sans);
    font-size: 7pt;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--brass);
    margin-bottom: 3mm;
  }

  /* A blockquote that is not a D-n decision is a plain emphasis block. */
  blockquote.plain {
    background: transparent;
    border-left: 2px solid var(--rule);
    padding: 0 0 0 4mm;
  }

  /* ---- tables ---------------------------------------------------------- */

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 3mm 0 5mm;
    font-size: 8.8pt;
    break-inside: auto;
  }
  thead { display: table-header-group; }
  tr { break-inside: avoid; }
  th {
    font-family: var(--sans);
    font-size: 7pt;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.10em;
    color: var(--muted);
    text-align: left;
    padding: 0 3mm 2mm 0;
    border-bottom: 1px solid var(--ink);
  }
  td {
    padding: 2mm 3mm 2mm 0;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }
  th:last-child, td:last-child { padding-right: 0; }

  /* The caption line a table may be preceded by. */
  p.table-caption {
    font-family: var(--sans);
    font-size: 7pt;
    text-transform: uppercase;
    letter-spacing: 0.10em;
    color: var(--muted);
    margin: 5mm 0 0;
  }

  /* ---- table of contents ------------------------------------------------ */

  /* Its own named page. Setting the running string from the contents heading instead would
     stick: every following page inherits the carried value until the next assignment lands. */
  @page toc {
    @top-left { content: "Contents"; }
  }
  .toc { page: toc; break-after: page; }
  .toc-head {
    font-family: var(--sans);
    font-size: 7pt;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--brass);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 2mm;
    margin: 0 0 5mm;
  }
  .toc-table { width: 100%; border-collapse: collapse; }
  .toc-table td {
    border: 0;
    padding: 0;
    vertical-align: bottom;
    font-family: var(--sans);
    font-size: 8.4pt;
    line-height: 1.9;
  }
  /* The dotted rule runs the full width of the title cell; the label sits on top of it with an
     opaque background, which masks the dots behind the text and leaves a true leader. */
  .toc-table td.t { border-bottom: 1px dotted var(--rule); }
  .toc-table td.t span {
    position: relative;
    top: 3px;
    background: #ffffff;
    padding-right: 2mm;
  }
  .toc-table tr.lvl2 td.t { padding-left: 7mm; }
  .toc-table tr.lvl2 td { font-size: 7.8pt; color: var(--muted); }
  .toc-table td.pg {
    text-align: right;
    width: 14mm;
    font-family: var(--mono);
    font-size: 8pt;
    color: var(--muted);
  }
  .toc-table td.pg a { text-decoration: none; color: inherit; }
  /* WeasyPrint resolves this against the target's final page. attr(href) without a type — the
     typed form attr(href url) yields 0 for every entry. */
  .toc-table td.pg a::after { content: target-counter(attr(href), page); }

  /* ---- landscape figure page --------------------------------------------- */

  /* The ERD gets a real landscape page. WeasyPrint honours a per-page size; this is the whole
     reason the document is not rendered by headless Chrome. */
  @page erd {
    size: A4 landscape;
    margin: 16mm;
  }

  /* A figure and the heading that introduces it are one unbreakable block, and the page break goes
     before the block rather than inside it. Breaking between them is what left page 6 of v2.1
     carrying a heading and nothing else. */
  .figure-block {
    break-inside: avoid;
  }
  .figure-block.landscape-figure {
    page: erd;
    break-before: page;
    break-after: page;
  }
  .figure-block h2,
  .figure-block h3 {
    break-after: avoid;
  }
  .figure-body svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Inline SVG diagrams that stay in the portrait flow. */
  .figure svg { width: 100%; height: auto; display: block; }
  .figure { break-inside: avoid; margin: 4mm 0 2mm; }

  /* ---- figures --------------------------------------------------------- */

  .mermaid {
    break-inside: avoid;
    margin: 4mm 0 2mm;
    text-align: center;
  }
  .mermaid svg { max-width: 100%; height: auto; }

  p.figure-caption {
    font-size: 7.5pt;
    color: var(--muted);
    margin: 0 0 5mm;
    break-before: avoid;
  }
  p.figure-caption .figure-label {
    font-family: var(--sans);
    font-size: 7pt;
    font-weight: 700;
    letter-spacing: 0.10em;
    color: var(--brass);
    margin-right: 2mm;
  }

  /* ---- code ------------------------------------------------------------ */

  code {
    font-family: var(--mono);
    font-size: 8.6pt;
    background: var(--code-bg);
    padding: 0.3mm 1mm;
    border-radius: 1px;
  }
  pre {
    background: var(--code-bg);
    padding: 3mm 4mm;
    margin: 3mm 0 5mm;
    overflow-x: auto;
    break-inside: avoid;
  }
  pre code { background: none; padding: 0; font-size: 8.2pt; line-height: 1.45; }

  /* Rule and assumption identifiers read as identifiers, not prose, and never wrap. */
  td > code:first-child, li > code:first-child { color: var(--brass); white-space: nowrap; }
  table td:first-child > code:only-child { display: inline-block; }
  /* The narrow identifier column in the assumption and rule tables. */
  table th:first-child, table td:first-child { white-space: nowrap; }
  table th:nth-child(2), table td:nth-child(2) { white-space: normal; }

  /* ---- lists and rules ------------------------------------------------- */

  ul, ol { margin: 0 0 4mm; padding-left: 5mm; }
  li { margin-bottom: 1.5mm; }

  hr { border: 0; border-top: 1px solid var(--rule); margin: 7mm 0; }

  strong { font-weight: 700; }
  a { color: var(--ink); text-decoration: none; }
</style>
</head>
<body>
